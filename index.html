<form id="weather-form">
    <label for="state-input">State abbreviation</label>
    <input
        type="text"
        id="state-input"
        placeholder="Enter state abbreviation"
        maxlength="2"
        autocomplete="off"
    >
    <button type="submit">Get Weather Alerts</button>
</form>

<div id="loading-spinner" class="hidden">
    Loading weather alerts...
</div>

<div id="error-message" class="hidden" role="alert"></div>

<div id="alerts-display" aria-live="polite"></div>
